[package]
name = "corivo-mcp"
version = "0.1.0"
edition = "2021"
description = "Corivo MCP sidecar — JSON-RPC 2.0 stdio MCP server that forwards tool calls to the Corivo main process via a UDS bridge. Used by external MCP clients."

[lib]
name = "corivo_mcp"
path = "src/lib.rs"

[[bin]]
name = "corivo-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-util", "io-std", "net", "sync", "time"] }
